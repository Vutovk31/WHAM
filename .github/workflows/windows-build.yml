name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate macro contracts
        run: node tests/test-macros.mjs

      - name: Validate macros with Windows PowerShell
        shell: powershell
        run: .\tests\Test-Macros.ps1

      - name: Run Windows self-test
        shell: powershell
        run: .\WHAM.QuickReplies.ps1 -SelfTest

      - name: Build and verify portable package
        shell: powershell
        run: |
          $packageRoot = 'dist\WHAM-Quick-Replies'
          $packageTests = Join-Path $packageRoot 'tests'
          $archivePath = 'dist\WHAM-Quick-Replies-windows-x64.zip'
          $verificationRoot = 'dist\package-verification'

          New-Item -ItemType Directory -Path $packageTests -Force | Out-Null
          Copy-Item WHAM.QuickReplies.ps1, macros.json, start-wham.cmd, toggle-autostart.cmd, verify-wham.cmd, install-wham.cmd, uninstall-wham.cmd, README.md, BETA-TEST-INSTRUCTION.txt -Destination $packageRoot
          Copy-Item tests\Test-NotepadPaste.ps1 -Destination $packageTests

          $requiredFiles = @(
            'WHAM.QuickReplies.ps1',
            'macros.json',
            'start-wham.cmd',
            'toggle-autostart.cmd',
            'verify-wham.cmd',
            'install-wham.cmd',
            'uninstall-wham.cmd',
            'README.md',
            'BETA-TEST-INSTRUCTION.txt',
            'tests\Test-NotepadPaste.ps1'
          )
          foreach ($relativePath in $requiredFiles) {
            $sourcePath = Join-Path $packageRoot $relativePath
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "Portable package is missing required file: $relativePath"
            }
          }

          Compress-Archive -Path $packageRoot -DestinationPath $archivePath -Force
          Expand-Archive -LiteralPath $archivePath -DestinationPath $verificationRoot -Force
          foreach ($relativePath in $requiredFiles) {
            $archivedPath = Join-Path (Join-Path $verificationRoot 'WHAM-Quick-Replies') $relativePath
            if (-not (Test-Path -LiteralPath $archivedPath -PathType Leaf)) {
              throw "Portable ZIP verification failed for: $relativePath"
            }
          }

          $hash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WHAM-Quick-Replies-windows-x64.zip" | Set-Content dist\SHA256SUMS.txt -Encoding ASCII

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: WHAM-Quick-Replies-windows-x64
          path: |
            dist/WHAM-Quick-Replies-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
