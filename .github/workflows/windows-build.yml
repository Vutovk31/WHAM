name: Windows beta validation

on:
  push:
    branches:
      - main
      - 'stabilize/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate beta contracts
        run: node tests/test-macros.mjs

      - name: Prepare UTF-8 BOM for Windows PowerShell 5.1
        shell: pwsh
        run: |
          $utf8Bom = [System.Text.UTF8Encoding]::new($true)
          foreach ($path in @('WHAM.QuickReplies.ps1', 'tests\Test-Macros.ps1')) {
            $text = [System.IO.File]::ReadAllText($path, [System.Text.UTF8Encoding]::new($false, $true))
            [System.IO.File]::WriteAllText($path, $text, $utf8Bom)
          }

      - name: Validate macros with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-Macros.ps1

      - name: Run deterministic application self-test
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File WHAM.QuickReplies.ps1 -SelfTest

      - name: Build and verify portable beta package
        shell: powershell
        run: |
          $packageRoot = 'dist\WHAM-Quick-Replies'
          $packageTests = Join-Path $packageRoot 'tests'
          $archivePath = 'dist\WHAM-Quick-Replies-windows-x64.zip'
          $verificationRoot = 'dist\package-verification'

          New-Item -ItemType Directory -Path $packageTests -Force | Out-Null
          Copy-Item WHAM.QuickReplies.ps1, macros.json, start-wham.cmd, toggle-autostart.cmd, verify-wham.cmd, install-wham.cmd, uninstall-wham.cmd, README.md, BETA-TEST-INSTRUCTION.txt -Destination $packageRoot
          Copy-Item tests\Test-NotepadPaste.ps1 -Destination $packageTests

          $requiredFiles = @(
            'WHAM.QuickReplies.ps1',
            'macros.json',
            'start-wham.cmd',
            'toggle-autostart.cmd',
            'verify-wham.cmd',
            'install-wham.cmd',
            'uninstall-wham.cmd',
            'README.md',
            'BETA-TEST-INSTRUCTION.txt',
            'tests\Test-NotepadPaste.ps1'
          )

          foreach ($relativePath in $requiredFiles) {
            $sourcePath = Join-Path $packageRoot $relativePath
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "Portable package is missing required file: $relativePath"
            }
          }

          # Archive the package contents, not the containing directory. When the
          # user opens the ZIP, launchers and macros.json must be visible at once.
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $archivePath -Force
          Expand-Archive -LiteralPath $archivePath -DestinationPath $verificationRoot -Force

          foreach ($relativePath in $requiredFiles) {
            $archivedPath = Join-Path $verificationRoot $relativePath
            if (-not (Test-Path -LiteralPath $archivedPath -PathType Leaf)) {
              throw "Flat portable ZIP verification failed for: $relativePath"
            }
          }

          if (Test-Path -LiteralPath (Join-Path $verificationRoot 'WHAM-Quick-Replies') -PathType Container) {
            throw 'Portable ZIP must not contain a redundant top-level WHAM-Quick-Replies folder.'
          }

          $hash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WHAM-Quick-Replies-windows-x64.zip" | Set-Content dist\SHA256SUMS.txt -Encoding ASCII

      - name: Upload Windows beta package
        uses: actions/upload-artifact@v4
        with:
          name: WHAM-Quick-Replies-windows-x64
          path: |
            dist/WHAM-Quick-Replies-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
