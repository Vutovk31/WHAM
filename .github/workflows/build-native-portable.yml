name: Build native portable WHAM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/WHAM.QuickReplies.Native/**"
      - ".github/workflows/build-native-portable.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native source safety and version
        shell: pwsh
        run: |
          $source = "src/WHAM.QuickReplies.Native"
          $expectedVersion = "0.10.0-native-test1"

          $forbiddenFiles = Get-ChildItem -LiteralPath $source -Recurse -File |
            Where-Object { $_.Extension -in @('.cmd', '.bat', '.ps1', '.vbs') }
          if ($forbiddenFiles) {
            throw "Forbidden script files found in native source: $($forbiddenFiles.FullName -join ', ')"
          }

          $forbiddenPatterns = @(
            'ExecutionPolicy Bypass',
            'Invoke-Expression',
            'WScript.Shell',
            'Start-Process -WindowStyle Hidden',
            'Stop-Process -Force'
          )
          $sourceText = Get-ChildItem -LiteralPath $source -Recurse -File |
            Where-Object { $_.Extension -in @('.cs', '.csproj', '.json', '.txt', '.manifest') } |
            ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }
          foreach ($pattern in $forbiddenPatterns) {
            if ($sourceText -match [Regex]::Escape($pattern)) {
              throw "Forbidden launcher or process-control pattern found: $pattern"
            }
          }

          $versionFile = (Get-Content -LiteralPath "$source/VERSION.txt" -Raw).Trim()
          if ($versionFile -ne $expectedVersion) {
            throw "VERSION.txt mismatch: expected '$expectedVersion', found '$versionFile'"
          }

          $nativeApp = Get-Content -LiteralPath "$source/NativeApp.cs" -Raw
          if ($nativeApp -notmatch [Regex]::Escape("Version = `"$expectedVersion`"")) {
            throw "NativeApp.cs does not expose version '$expectedVersion'"
          }

          [xml]$project = Get-Content -LiteralPath "$source/WHAM.QuickReplies.Native.csproj" -Raw
          $assemblyVersion = [string]$project.Project.PropertyGroup.Version
          if ($assemblyVersion -ne '0.10.0') {
            throw "Project assembly version mismatch: expected '0.10.0', found '$assemblyVersion'"
          }

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/WHAM.QuickReplies.Native/WHAM.QuickReplies.Native.csproj

      - name: Build
        run: dotnet build src/WHAM.QuickReplies.Native/WHAM.QuickReplies.Native.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows x64
        run: >-
          dotnet publish src/WHAM.QuickReplies.Native/WHAM.QuickReplies.Native.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output native-publish

      - name: Verify package contents
        shell: pwsh
        run: |
          $required = @(
            "native-publish/WHAM Quick Replies.exe",
            "native-publish/macros.json",
            "native-publish/README-FIRST.txt",
            "native-publish/VERSION.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required package file is missing: $path"
            }
          }
          $forbidden = Get-ChildItem -LiteralPath native-publish -Recurse -File |
            Where-Object { $_.Extension -in @('.cmd', '.bat', '.ps1', '.vbs') }
          if ($forbidden) {
            throw "Forbidden script files found: $($forbidden.FullName -join ', ')"
          }

      - name: Run deterministic package self-test
        shell: pwsh
        run: |
          $publishDirectory = (Resolve-Path -LiteralPath "native-publish").Path
          $executable = Join-Path $publishDirectory "WHAM Quick Replies.exe"
          $selfTestLog = Join-Path $publishDirectory "WHAM-self-test.log"
          Remove-Item -LiteralPath $selfTestLog -Force -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath $executable `
            -ArgumentList "--self-test" `
            -WorkingDirectory $publishDirectory `
            -PassThru

          try {
            if (-not $process.WaitForExit(15000)) {
              throw "Native package self-test did not finish within 15 seconds."
            }

            if ($process.ExitCode -ne 0) {
              $details = if (Test-Path -LiteralPath $selfTestLog) {
                Get-Content -LiteralPath $selfTestLog -Raw
              } else {
                "No WHAM-self-test.log was produced."
              }
              throw "Native package self-test failed with exit code $($process.ExitCode). $details"
            }
          }
          finally {
            if (-not $process.HasExited) {
              $process.Kill($true)
              $process.WaitForExit(5000) | Out-Null
            }
          }

          if (-not (Test-Path -LiteralPath $selfTestLog -PathType Leaf)) {
            throw "Native package self-test returned success but did not create WHAM-self-test.log"
          }

          $selfTestResult = (Get-Content -LiteralPath $selfTestLog -Raw).Trim()
          if ($selfTestResult -notmatch '^PASS \| WHAM Quick Replies 0\.10\.0-native-test1 \|') {
            throw "Unexpected native package self-test result: $selfTestResult"
          }

          Remove-Item -LiteralPath $selfTestLog -Force

      - name: Smoke-test published executable startup
        shell: pwsh
        run: |
          $publishDirectory = (Resolve-Path -LiteralPath "native-publish").Path
          $executable = Join-Path $publishDirectory "WHAM Quick Replies.exe"
          $errorLog = Join-Path $publishDirectory "WHAM-errors.log"
          Remove-Item -LiteralPath $errorLog -Force -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath $executable `
            -WorkingDirectory $publishDirectory `
            -PassThru

          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              $details = if (Test-Path -LiteralPath $errorLog) {
                Get-Content -LiteralPath $errorLog -Raw
              } else {
                "No WHAM-errors.log was produced."
              }
              throw "Published executable exited during startup smoke test. Exit code: $($process.ExitCode). $details"
            }
          }
          finally {
            if (-not $process.HasExited) {
              $process.Kill($true)
              $process.WaitForExit(5000) | Out-Null
            }
          }

          if (Test-Path -LiteralPath $errorLog) {
            throw "Published executable produced WHAM-errors.log during startup smoke test: $(Get-Content -LiteralPath $errorLog -Raw)"
          }

      - name: Create versioned ZIP and SHA256
        shell: pwsh
        run: |
          $package = "WHAM_Quick_Replies_v0.10.0-native-test1_win-x64"
          $folder = Join-Path $PWD $package
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item -LiteralPath "native-publish/WHAM Quick Replies.exe" -Destination $folder
          Copy-Item -LiteralPath "native-publish/macros.json" -Destination $folder
          Copy-Item -LiteralPath "native-publish/README-FIRST.txt" -Destination $folder
          Copy-Item -LiteralPath "native-publish/VERSION.txt" -Destination $folder
          Compress-Archive -LiteralPath $folder -DestinationPath "$package.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "$package.zip").Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$package.zip.sha256.txt" -Value "$hash  $package.zip" -Encoding ascii

      - name: Verify versioned archive integrity
        shell: pwsh
        run: |
          $package = "WHAM_Quick_Replies_v0.10.0-native-test1_win-x64"
          $expectedVersion = "0.10.0-native-test1"
          $zipPath = "$package.zip"
          $checksumPath = "$package.zip.sha256.txt"
          $extractRoot = Join-Path $PWD "archive-verification"

          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractRoot -Force
          $packageRoot = Join-Path $extractRoot $package
          if (-not (Test-Path -LiteralPath $packageRoot -PathType Container)) {
            throw "Archive does not contain the expected versioned root folder: $package"
          }

          $expectedNames = @(
            "WHAM Quick Replies.exe",
            "macros.json",
            "README-FIRST.txt",
            "VERSION.txt"
          )
          $actualFiles = Get-ChildItem -LiteralPath $packageRoot -Recurse -File
          $relativeNames = $actualFiles | ForEach-Object {
            [IO.Path]::GetRelativePath($packageRoot, $_.FullName).Replace('\', '/')
          }
          $unexpected = $relativeNames | Where-Object { $_ -notin $expectedNames }
          $missing = $expectedNames | Where-Object { $_ -notin $relativeNames }
          if ($unexpected -or $missing -or $relativeNames.Count -ne $expectedNames.Count) {
            throw "Archive contents mismatch. Missing: $($missing -join ', '). Unexpected: $($unexpected -join ', ')."
          }

          $archiveVersion = (Get-Content -LiteralPath (Join-Path $packageRoot "VERSION.txt") -Raw).Trim()
          if ($archiveVersion -ne $expectedVersion) {
            throw "Archive VERSION.txt mismatch: expected '$expectedVersion', found '$archiveVersion'"
          }

          $checksumLine = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          $expectedHash = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) {
            throw "SHA256 mismatch for $zipPath"
          }

          $forbidden = $actualFiles | Where-Object { $_.Extension -in @('.cmd', '.bat', '.ps1', '.vbs') }
          if ($forbidden) {
            throw "Forbidden script files found inside final archive: $($forbidden.FullName -join ', ')"
          }

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: WHAM_Quick_Replies_v0.10.0-native-test1_win-x64
          path: |
            WHAM_Quick_Replies_v0.10.0-native-test1_win-x64.zip
            WHAM_Quick_Replies_v0.10.0-native-test1_win-x64.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30
