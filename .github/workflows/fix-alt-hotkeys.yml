name: Repair Alt hotkeys

on:
  push:
    paths:
      - '.github/workflows/fix-alt-hotkeys.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch hotkey parser and self-test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'WHAM.QuickReplies.ps1'
          $text = [IO.File]::ReadAllText($path)

          $oldHotkeys = @'
          $script:Hotkeys = @(
              'Ctrl+Alt+1','Ctrl+Alt+2','Ctrl+Alt+3','Ctrl+Alt+4','Ctrl+Alt+5',
              'Ctrl+Alt+6','Ctrl+Alt+7','Ctrl+Alt+8','Ctrl+Alt+9','Shift+Tab'
          )
          '@
          $newHotkeys = @'
          $script:Hotkeys = @(
              'Ctrl+Alt+1','Ctrl+Alt+2','Ctrl+Alt+3','Ctrl+Alt+4','Ctrl+Alt+5',
              'Ctrl+Alt+6','Ctrl+Alt+7','Ctrl+Alt+8','Ctrl+Alt+9',
              'Alt+1','Alt+2','Alt+3','Alt+4','Alt+5','Alt+6','Alt+7','Alt+8','Alt+9',
              'Ctrl+Shift+1','Ctrl+Shift+2','Ctrl+Shift+3','Ctrl+Shift+4','Ctrl+Shift+5',
              'Ctrl+Shift+6','Ctrl+Shift+7','Ctrl+Shift+8','Ctrl+Shift+9','Shift+Tab'
          )
          '@
          if (-not $text.Contains($oldHotkeys)) { throw 'Hotkey list block was not found.' }
          $text = $text.Replace($oldHotkeys, $newHotkeys)

          $oldBinding = @'
          function Get-Binding([string]$Value) {
              $value = Normalize-Hotkey $Value
              [uint32]$mod = 0x4000
              if ($value -match '^Ctrl\+Alt\+([1-9])$') {
                  $mod = $mod -bor 0x0001 -bor 0x0002
                  $key = [Enum]::Parse([System.Windows.Forms.Keys], "D$($Matches[1])", $true)
              } else {
                  $mod = $mod -bor 0x0004
                  $key = [System.Windows.Forms.Keys]::Tab
              }
              [pscustomobject]@{ Hotkey=$value; Modifiers=[uint32]$mod; Key=[uint32]$key }
          }
          '@
          $newBinding = @'
          function Get-Binding([string]$Value) {
              $value = Normalize-Hotkey $Value
              [uint32]$mod = 0x4000
              $keyName = $null
              foreach ($part in ($value -split '\+')) {
                  switch ($part.ToUpperInvariant()) {
                      'ALT'   { $mod = $mod -bor 0x0001 }
                      'CTRL'  { $mod = $mod -bor 0x0002 }
                      'SHIFT' { $mod = $mod -bor 0x0004 }
                      'WIN'   { $mod = $mod -bor 0x0008 }
                      default {
                          if ($null -ne $keyName) { throw "В комбинации '$value' должна быть одна основная клавиша." }
                          $keyName = $part
                      }
                  }
              }
              if ([string]::IsNullOrWhiteSpace($keyName)) { throw "В комбинации '$value' отсутствует основная клавиша." }
              if ($keyName -match '^[0-9]$') { $keyName = "D$keyName" }
              try { $key = [Enum]::Parse([System.Windows.Forms.Keys], $keyName, $true) }
              catch { throw "Клавиша '$keyName' не поддерживается Windows." }
              [pscustomobject]@{ Hotkey=$value; Modifiers=[uint32]$mod; Key=[uint32]$key }
          }
          '@
          if (-not $text.Contains($oldBinding)) { throw 'Get-Binding block was not found.' }
          $text = $text.Replace($oldBinding, $newBinding)

          $oldSelfTest = @'
              $test=New-Object WhamHost;try{$test.Register(9999,[uint32](0x4000-bor 0x0001-bor 0x0002),[uint32][System.Windows.Forms.Keys]::F24);$test.Unregister(9999)}finally{$test.Dispose()}
          '@
          $newSelfTest = @'
              if((Get-Binding 'Alt+1').Hotkey -cne 'Alt+1'){throw 'Alt+1 test failed.'}
              if((Get-Binding 'Ctrl+Alt+1').Hotkey -cne 'Ctrl+Alt+1'){throw 'Ctrl+Alt+1 test failed.'}
          '@
          if (-not $text.Contains($oldSelfTest)) { throw 'Fragile RegisterHotKey self-test was not found.' }
          $text = $text.Replace($oldSelfTest, $newSelfTest)

          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($true)))

          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
          )
          if ($errors.Count -gt 0) {
              throw (($errors | ForEach-Object { $_.Message }) -join "`r`n")
          }

      - name: Run deterministic self-test
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File WHAM.QuickReplies.ps1 -SelfTest

      - name: Commit repaired core
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WHAM.QuickReplies.ps1
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: support Alt hotkeys without fragile self-test registration"
            git push
          }
